name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-typecheck-test-validate:
    runs-on: ubuntu-latest
    env:
      PIPELINE_MODE: tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./dagster-gx-pipeline[dev]

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make typecheck

      - name: Pytest
        run: make test

      - name: Tiny deterministic run + GX validation
        run: |
          make run
          make validate
          make report

      - name: Validate docker compose config (optional)
        run: |
          if command -v docker >/dev/null && docker compose version >/dev/null 2>&1; then
            if [ -f docker-compose.yml ]; then
              docker compose -f docker-compose.yml config >/dev/null
              echo "Validated docker-compose.yml"
            elif [ -f compose.yml ]; then
              docker compose -f compose.yml config >/dev/null
              echo "Validated compose.yml"
            else
              echo "No docker compose file found; skipping"
            fi
          else
            echo "Docker compose unavailable; skipping"
          fi
