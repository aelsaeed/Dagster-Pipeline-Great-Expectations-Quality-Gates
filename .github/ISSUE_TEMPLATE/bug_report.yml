name: Bug report
description: Report a reproducible defect.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please include enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
      placeholder: A concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact commands, inputs, and environment details.
      placeholder: |
        1. Run ...
        2. Materialize ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant dependency versions.
      placeholder: Ubuntu 22.04, Python 3.11.8
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traces
      description: Paste stack traces, Dagster logs, or CI links.
      render: shell
